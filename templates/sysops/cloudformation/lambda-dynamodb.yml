AWSTemplateFormatVersion: '2010-09-09'
Description: API de autorización sintética con Lambda y contador DynamoDB parametrizado por ambiente.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  Environment:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  LambdaHandler:
    Type: String
    Default: auth_service.handler.lambda_handler
    AllowedPattern: '^[A-Za-z0-9_.]{1,128}$'
  FrequencyPartitionKey:
    Type: String
    Default: pk
    AllowedPattern: '^[A-Za-z0-9_.-]{1,64}$'
    Description: Clave de partición de la tabla (DeploymentComponent.configuration.partition_key).
  FrequencyTtlAttribute:
    Type: String
    Default: ttl
    AllowedPattern: '^[A-Za-z0-9_.-]{1,64}$'
    Description: Atributo TTL de la tabla (DeploymentComponent.configuration.ttl_attribute).
  FrequencyStore:
    Type: String
    Default: dynamodb
    AllowedValues: [dynamodb, memory]
    Description: Implementación del contador en la Lambda (configuration.FREQUENCY_STORE).

Resources:
  FrequencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: !Ref FrequencyPartitionKey
          AttributeType: S
      KeySchema:
        - AttributeName: !Ref FrequencyPartitionKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: !Ref FrequencyTtlAttribute
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: frequency-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt FrequencyTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${FunctionLogGroup.Arn}:*'

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}'
      RetentionInDays: 7

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}'
      Runtime: python3.12
      Handler: !Ref LambdaHandler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          FREQUENCY_TABLE_NAME: !Ref FrequencyTable
          FREQUENCY_STORE: !Ref FrequencyStore
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  AuthorizationApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      EndpointConfiguration:
        Types: [REGIONAL]

  AuthorizeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthorizationApi
      ParentId: !GetAtt AuthorizationApi.RootResourceId
      PathPart: authorize

  AuthorizeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthorizationApi
      ResourceId: !Ref AuthorizeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt Function.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthorizationApi}/*/POST/authorize'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: AuthorizeMethod
    Properties:
      RestApiId: !Ref AuthorizationApi
      StageName: !Ref Environment

Outputs:
  FunctionArn:
    Value: !GetAtt Function.Arn
  FrequencyTableName:
    Value: !Ref FrequencyTable
  AuthorizeUrl:
    Value: !Sub 'https://${AuthorizationApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/authorize'
