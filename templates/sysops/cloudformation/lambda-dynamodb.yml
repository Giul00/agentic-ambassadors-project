AWSTemplateFormatVersion: '2010-09-09'
Description: API sintética con API Gateway (proxy), Lambda y una tabla DynamoDB, parametrizada por ambiente.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  Environment:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  LambdaHandler:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_.]{1,128}$'
    Description: Entrypoint del entregable de Desarrollo (DeployableArtifact.entrypoint).
  TablePartitionKey:
    Type: String
    Default: pk
    AllowedPattern: '^[A-Za-z0-9_.-]{1,64}$'
    Description: Clave de partición (DeploymentComponent.configuration.partition_key).
  TableTtlAttribute:
    Type: String
    Default: ''
    AllowedPattern: '^[A-Za-z0-9_.-]{0,64}$'
    Description: Atributo TTL (configuration.ttl_attribute). Vacío = sin TTL.
  StorageBackend:
    Type: String
    Default: dynamodb
    AllowedValues: [dynamodb, memory]
    Description: Adaptador de persistencia de la Lambda (configuration.STORAGE_BACKEND).

Conditions:
  HasTtl: !Not [!Equals [!Ref TableTtlAttribute, '']]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: !Ref TablePartitionKey
          AttributeType: S
      KeySchema:
        - AttributeName: !Ref TablePartitionKey
          KeyType: HASH
      TimeToLiveSpecification: !If
        - HasTtl
        - AttributeName: !Ref TableTtlAttribute
          Enabled: true
        - !Ref AWS::NoValue
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${FunctionLogGroup.Arn}:*'

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}'
      RetentionInDays: 7

  Function:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}'
      Runtime: python3.12
      Handler: !Ref LambdaHandler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          STORAGE_BACKEND: !Ref StorageBackend
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  # La API no lleva tags: el rol del workshop no permite etiquetar API Gateway.
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      EndpointConfiguration:
        Types: [REGIONAL]

  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: '{proxy+}'

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations'
          - FunctionArn: !GetAtt Function.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ProxyMethod
    Properties:
      RestApiId: !Ref Api
      StageName: !Ref Environment

Outputs:
  ApiUrl:
    Description: URL base de la API (sin barra final).
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  FunctionName:
    Value: !Ref Function
  TableName:
    Value: !Ref Table
