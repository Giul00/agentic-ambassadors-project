[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-crew"
version = "0.1.0"
description = "Sistema multiagente de requerimiento a despliegue para adquirencia"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0",
    "boto3>=1.35",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/auth_service/tests", "services/merchants_api/tests"]
pythonpath = ["src", "services/auth_service", "services/merchants_api"]
markers = [
    "bedrock_smoke: llama a Bedrock real; excluido de la corrida normal",
]
addopts = "-m 'not bedrock_smoke'"
