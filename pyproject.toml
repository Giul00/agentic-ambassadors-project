[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-crew"
version = "0.1.0"
description = "Sistema multiagente de requerimiento a despliegue para adquirencia"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.0",
    "boto3>=1.35",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
